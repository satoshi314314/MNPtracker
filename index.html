<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MNP管理ノート</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0f1e;color:#e2e8f0;font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;padding-bottom:90px}
input,select,textarea,button{font-family:inherit}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.5)}
.hdr{background:linear-gradient(135deg,#0d1b2a,#0a1628);border-bottom:1px solid #1e3a5f;padding:20px 16px 14px;position:sticky;top:0;z-index:10}
.hdr h1{font-size:18px;font-weight:900;color:#fff;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.hdr p{font-size:11px;color:#64748b;margin-bottom:12px}
.tabrow{display:flex;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:4px}
.tbtn{padding:6px 14px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:#64748b;position:relative}
.tbtn.on{background:#00ffc6;color:#003d2e}
.bdg{position:absolute;top:-4px;right:-4px;background:#ff6b6b;color:#fff;border-radius:99px;font-size:10px;font-weight:900;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.iobtns{display:flex;gap:6px}
.iobtn{padding:6px 10px;border-radius:8px;border:1px solid #1e3a5f;background:transparent;font-size:11px;font-weight:700;cursor:pointer}
#main{max-width:640px;margin:0 auto;padding:16px}
.fab{position:fixed;bottom:24px;right:20px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#00ffc6,#00b386);border:none;cursor:pointer;font-size:26px;color:#003d2e;box-shadow:0 4px 20px rgba(0,255,198,0.25);display:flex;align-items:center;justify-content:center;font-weight:900;z-index:20}
.tlcard{background:#111827;border:1px solid #1e293b;border-radius:14px;margin-bottom:14px;overflow:hidden}
.tlhdr{padding:12px 14px 10px;border-bottom:1px solid #1e293b}
.tlbody{padding:12px 14px 0}
.tlrow{display:flex;gap:10px;margin-bottom:0}
.tlline{display:flex;flex-direction:column;align-items:center;width:18px;flex-shrink:0}
.tldot{width:13px;height:13px;border-radius:50%;border:2px solid #64748b;flex-shrink:0;margin-top:2px}
.tlstem{width:2px;background:#1e293b;min-height:20px;margin:4px 0;flex:1}
.tlcontent{flex:1;padding-bottom:14px}
.tlcontent.last{padding-bottom:4px}
.tladdbtn{width:100%;padding:11px;background:none;border:none;border-top:1px dashed #1e3a5f;color:#00ffc6;font-size:13px;font-weight:700;cursor:pointer}
.pchip{font-family:monospace;font-weight:700;font-size:14px}
.pos{color:#00ffc6}.neg{color:#ff6b6b}
.ichip{border-radius:8px;padding:3px 8px;font-size:11px;display:inline-flex;align-items:center;gap:3px;margin:2px}
.irecv{background:rgba(0,255,198,0.06);border:1px solid rgba(0,255,198,0.18);color:#00ffc6}
.iexp{background:rgba(124,58,237,0.09);border:1px solid rgba(124,58,237,0.22);color:#a78bfa}
.accard{border-radius:14px;padding:14px;margin-bottom:10px}
.acready{background:#1a0a0a;border:1px solid rgba(255,107,107,0.25)}
.acwait{background:#111827;border:1px solid #1e293b}
.pgbg{background:#1e293b;border-radius:99px;height:6px;overflow:hidden;margin-top:10px}
.pgfill{height:100%;border-radius:99px;background:linear-gradient(90deg,#7dd3fc,#00ffc6)}
.shero{background:linear-gradient(135deg,#003d2e,#001a13);border:1px solid rgba(0,255,198,0.25);border-radius:14px;padding:22px 18px;margin-bottom:14px;text-align:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.scard{background:#111827;border:1px solid #1e293b;border-radius:12px;padding:14px}
.scard .sl{font-size:11px;color:#64748b;margin-bottom:5px}
.scard .sv{font-size:19px;font-weight:700}
.empty{text-align:center;padding:60px 0;color:#334155;font-size:14px}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.ovl.ctr{align-items:center;padding:20px}
.sheet{background:#111827;border-radius:20px 20px 0 0;padding:22px 18px 40px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto}
.stitle{font-size:17px;font-weight:900;margin-bottom:18px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;color:#64748b;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #1e293b;background:#0d1117;color:#e2e8f0;font-size:14px;outline:none}
.fld textarea{height:68px;resize:vertical}
.slbl{font-size:12px;color:#64748b;font-weight:700;margin:4px 0 8px;display:flex;justify-content:space-between}
.febox{background:#0d1117;border-radius:12px;border:1px solid #1e293b;margin-bottom:14px}
.ferow{padding:10px 12px;border-bottom:1px solid #1e293b}
.fetop{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.ferlbl{font-size:11px;color:#94a3b8;font-weight:700;min-width:56px}
.numinp{flex:1;min-width:70px;padding:7px 10px;border-radius:8px;border:1px solid #1e293b;background:#0a0f1e;color:#e2e8f0;font-size:13px;outline:none;text-align:right}
.noteinp{width:100%;padding:5px 10px;border-radius:8px;border:1px solid #1e293b;background:#0a0f1e;color:#94a3b8;font-size:12px;outline:none}
.rmbtn{background:none;border:none;color:#475569;cursor:pointer;font-size:18px;padding:0 3px;line-height:1}
.addbtn{width:100%;padding:10px;background:none;border:none;font-size:13px;font-weight:700;cursor:pointer;border-top:1px dashed #1e3a5f}
.typsel{padding:7px 10px;border-radius:8px;border:1px solid #1e293b;background:#1a2535;color:#e2e8f0;font-size:12px;outline:none;min-width:130px}
.stgl{display:flex;border-radius:8px;overflow:hidden;border:1px solid #1e293b;flex-shrink:0}
.stglbtn{padding:6px 10px;border:none;cursor:pointer;font-size:11px;font-weight:700;background:#0d1117;color:#475569}
.stglbtn.ron{background:rgba(0,255,198,0.12);color:#00ffc6}
.stglbtn.eon{background:rgba(124,58,237,0.18);color:#a78bfa}
.dateinp{flex:1;padding:6px 10px;border-radius:8px;border:1px solid #1e293b;background:#0a0f1e;color:#e2e8f0;font-size:12px;outline:none}
.pvbar{background:#0d1117;border:1px solid #1e293b;border-radius:12px;padding:12px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.pvlbl{font-size:10px;color:#475569;margin-bottom:3px}
.pvval{font-size:13px;font-weight:700;font-family:monospace}
.btnrow{display:flex;gap:10px}
.bcnl{flex:1;padding:13px;border-radius:12px;border:1px solid #1e293b;background:transparent;color:#64748b;font-size:14px;font-weight:700;cursor:pointer}
.bsav{flex:2;padding:13px;border-radius:12px;border:none;background:linear-gradient(135deg,#00ffc6,#00b386);color:#003d2e;font-size:14px;font-weight:900;cursor:pointer}
.bdng{flex:1;padding:12px;border-radius:10px;border:none;background:#7f1d1d;color:#ff6b6b;font-size:14px;font-weight:700;cursor:pointer}
.cfcard{background:#111827;border-radius:14px;padding:22px;max-width:310px;width:100%}
.filelbl{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:12px;border:2px dashed #1e3a5f;cursor:pointer;color:#7dd3fc;font-size:14px;font-weight:700;background:#0d1117;margin-bottom:14px}
.impmode{display:flex;border-radius:10px;overflow:hidden;border:1px solid #1e293b;margin-bottom:14px}
.mbtn{flex:1;padding:10px 8px;border:none;cursor:pointer;font-size:12px;font-weight:700;background:#0d1117;color:#475569}
.mbtn:first-child{border-right:1px solid #1e293b}
.mbtn.mon{background:#003d2e;color:#00ffc6}
.mbtn.ron{background:#7f1d1d;color:#ff6b6b}
.mdesc{font-size:10px;font-weight:400;margin-top:2px;opacity:.8}
.ebox{background:#3f1515;border:1px solid #7f1d1d;border-radius:10px;padding:10px 12px;color:#ff6b6b;font-size:13px;margin-bottom:12px}
.okbox{background:rgba(0,255,198,0.06);border:1px solid rgba(0,255,198,0.18);border-radius:10px;padding:10px 12px;color:#00ffc6;font-weight:700;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>

<div class="hdr">
  <h1>📱 MNP管理ノート</h1>
  <p>キャリア乗り換えの収支・記録を管理</p>
  <div class="tabrow">
    <div class="tabs">
      <button class="tbtn on" data-tab="timeline">番号別</button>
      <button class="tbtn" data-tab="alert">MNPアラート<span class="bdg" id="abadge" style="display:none"></span></button>
      <button class="tbtn" data-tab="summary">収支サマリー</button>
    </div>
    <div class="iobtns">
      <button class="iobtn" style="color:#7dd3fc" id="importBtn">⬆ 読込</button>
      <button class="iobtn" style="color:#94a3b8" id="exportBtn">⬇ 保存</button>
    </div>
  </div>
</div>

<div id="main"></div>
<button class="fab" id="fab">+</button>

<!-- Edit Sheet -->
<div class="ovl" id="editOvl" style="display:none">
  <div class="sheet">
    <div class="stitle" id="editTitle">新しいMNPを記録</div>
    <div class="fld"><label>キャリア</label><select id="fCarrier"></select></div>
    <div class="fld"><label>ステータス</label>
      <select id="fStatus"><option value="active">運用中</option><option value="ended">終了</option></select></div>
    <div class="fld"><label>電話番号</label><input id="fPhone" type="tel" placeholder="070-XXXX-XXXX"></div>
    <div class="fld"><label>プラン名</label><input id="fPlan" type="text" placeholder="例: ahamo 20GB"></div>
    <div class="fld"><label>開始日</label><input id="fStart" type="date"></div>
    <div class="fld"><label>終了日（MNP転出日）</label><input id="fEnd" type="date"></div>
    <div class="slbl">収入（種類ごと）<span id="incTotal" style="font-family:monospace;color:#00ffc6"></span></div>
    <div class="febox" id="incEditor"></div>
    <div class="slbl">月額料金（月ごと）<span id="feeTotal" style="font-family:monospace;color:#ff6b6b"></span></div>
    <div class="febox" id="feeEditor"></div>
    <div class="slbl">その他費用</div>
    <div class="fld"><label>初期費用（SIM代など）（円）</label><input id="fSetup" type="number" placeholder="0"></div>
    <div class="fld"><label>その他費用（円）</label><input id="fOther" type="number" placeholder="0"></div>
    <div class="pvbar">
      <div><div class="pvlbl">収入</div><div class="pvval pos" id="pvInc">+0</div></div>
      <div><div class="pvlbl">出費</div><div class="pvval neg" id="pvCost">0</div></div>
      <div><div class="pvlbl">純利益</div><div class="pvval" id="pvProfit">+0</div></div>
    </div>
    <div class="fld"><label>メモ</label><textarea id="fNotes" placeholder="キャンペーン詳細、注意点など..."></textarea></div>
    <div class="btnrow">
      <button class="bcnl" id="editCancel">キャンセル</button>
      <button class="bsav" id="editSave">保存</button>
    </div>
  </div>
</div>

<!-- Delete Confirm -->
<div class="ovl ctr" id="delOvl" style="display:none">
  <div class="cfcard">
    <div style="font-size:15px;font-weight:700;margin-bottom:8px">削除しますか？</div>
    <div style="font-size:13px;color:#64748b;margin-bottom:18px">この記録は削除されます。</div>
    <div class="btnrow">
      <button class="bcnl" id="delCancel">キャンセル</button>
      <button class="bdng" id="delOk">削除</button>
    </div>
  </div>
</div>

<!-- Import Sheet -->
<div class="ovl" id="impOvl" style="display:none">
  <div class="sheet">
    <div class="stitle">データを読み込む</div>
    <p style="font-size:12px;color:#64748b;margin-bottom:14px">以前エクスポートした .json ファイルを選んでください</p>
    <label class="filelbl">📂 JSONファイルを選択<input type="file" accept=".json" id="impFile" style="display:none"></label>
    <div id="impErr" style="display:none" class="ebox"></div>
    <div id="impOk" style="display:none" class="okbox"></div>
    <div id="impModeWrap" style="display:none">
      <div class="slbl">読み込み方法</div>
      <div class="impmode">
        <button class="mbtn mon" id="mMerge">🔀 追記（重複スキップ）<div class="mdesc">既存データを残して追加</div></button>
        <button class="mbtn" id="mReplace">♻ 全置換<div class="mdesc">既存データを削除して上書き</div></button>
      </div>
      <div id="replaceWarn" style="display:none;font-size:11px;color:#ff6b6b;margin-bottom:10px"></div>
      <div class="btnrow">
        <button class="bcnl" id="impCancel">キャンセル</button>
        <button class="bsav" id="impDoBtn">追記して読み込む</button>
      </div>
    </div>
    <div id="impCancelOnly">
      <button class="bcnl" style="width:100%" id="impCancel2">キャンセル</button>
    </div>
  </div>
</div>

<script>
var CARRIERS = ["docomo","au","SoftBank","楽天Mobile","ahamo","povo","LINEMO","UQmobile","Y!mobile","IIJmio","mineo","NUROmobile","その他"];
var ITYPES = [
  {v:"cash",l:"現金",i:"💴"},
  {v:"jcb",l:"JCBギフトカード",i:"🎁"},
  {v:"quo",l:"QUOカード",i:"🃏"},
  {v:"aeon",l:"イオン商品券",i:"🛍"},
  {v:"amazon",l:"Amazonギフト券",i:"📦"},
  {v:"rakuten",l:"楽天ポイント",i:"🔴"},
  {v:"dpoint",l:"dポイント",i:"🔵"},
  {v:"aupoint",l:"Pontaポイント",i:"🟠"},
  {v:"paypay",l:"PayPayポイント",i:"🟡"},
  {v:"linepay",l:"LINEポイント",i:"🟢"},
  {v:"discount",l:"月額割引",i:"📉"},
  {v:"other",l:"その他",i:"💰"}
];
var TMAP = {};
for (var ti=0; ti<ITYPES.length; ti++) { TMAP[ITYPES[ti].v] = ITYPES[ti]; }

var CCOLORS = {
  "docomo":"#ee0000","au":"#ff6600","SoftBank":"#009900","楽天Mobile":"#cc0000",
  "ahamo":"#d50060","povo":"#ffe000","LINEMO":"#00b900","UQmobile":"#009944",
  "Y!mobile":"#e91e8c","IIJmio":"#0066cc","mineo":"#e8470d","NUROmobile":"#00a0e9","その他":"#64748b"
};

var INIT = [{
  id:1, carrier:"楽天Mobile", startDate:"2023-04-01", endDate:"2024-01-15", status:"ended",
  phoneNumber:"070-XXXX-XXXX", plan:"Rakuten最強プラン",
  monthlyFees:[{label:"1ヶ月め",amount:0,note:"無料キャンペーン"},{label:"2ヶ月め",amount:0,note:""},{label:"3ヶ月め",amount:0,note:""}],
  incomes:[
    {type:"cash",amount:20000,note:"MNP転入ボーナス",status:"received",date:"2023-04-10"},
    {type:"quo",amount:10000,note:"キャンペーン特典",status:"expected",date:"2023-07-01"}
  ],
  setupCost:3300, otherCost:0, notes:"1年間無料キャンペーン利用。MNP転出手数料なし。"
}];

var records = [];
try { records = JSON.parse(localStorage.getItem("mnp_v3") || "null") || INIT; } catch(e) { records = INIT; }

var curTab = "timeline";
var editId = null;
var delId = null;
var impData = null;
var impMode = "merge";
var fInc = [];
var fFee = [];

function sv() { localStorage.setItem("mnp_v3", JSON.stringify(records)); }
function n(v) { var x = parseFloat(v); return isNaN(x) ? 0 : x; }
function fd(d) { return d ? d.replace(/-/g,"/") : "—"; }
function cc(c) { return CCOLORS[c] || "#64748b"; }

function calcP(r) {
  var inc = 0;
  var incs = r.incomes || [];
  for (var i=0; i<incs.length; i++) inc += n(incs[i].amount);
  var mt = 0;
  var fees = r.monthlyFees || [];
  for (var i=0; i<fees.length; i++) mt += n(fees[i].amount);
  var cost = n(r.setupCost) + n(r.otherCost) + mt;
  return {profit: inc-cost, income: inc, cost: cost, mt: mt, months: fees.length};
}

function ph(val) {
  var cls = val >= 0 ? "pos" : "neg";
  var sign = val >= 0 ? "+" : "";
  return '<span class="pchip ' + cls + '">' + sign + val.toLocaleString() + '円</span>';
}

// Populate carrier select
var csel = document.getElementById("fCarrier");
for (var ci=0; ci<CARRIERS.length; ci++) {
  var op = document.createElement("option");
  op.value = CARRIERS[ci];
  op.textContent = CARRIERS[ci];
  csel.appendChild(op);
}

// Tabs
var tbtns = document.querySelectorAll(".tbtn");
for (var ti=0; ti<tbtns.length; ti++) {
  (function(btn) {
    btn.addEventListener("click", function() {
      curTab = btn.getAttribute("data-tab");
      for (var i=0; i<tbtns.length; i++) tbtns[i].className = "tbtn";
      btn.className = "tbtn on";
      render();
    });
  })(tbtns[ti]);
}

function groupBy() {
  var g = {};
  for (var i=0; i<records.length; i++) {
    var r = records[i];
    var k = r.phoneNumber || "（番号未設定）";
    if (!g[k]) g[k] = [];
    g[k].push(r);
  }
  var keys = Object.keys(g);
  for (var i=0; i<keys.length; i++) {
    g[keys[i]].sort(function(a,b) {
      var ad = a.startDate || "";
      var bd = b.startDate || "";
      return ad < bd ? -1 : ad > bd ? 1 : 0;
    });
  }
  return g;
}

function updateBadge() {
  var now = new Date();
  var g = groupBy();
  var keys = Object.keys(g);
  var cnt = 0;
  for (var i=0; i<keys.length; i++) {
    var recs = g[keys[i]];
    var latest = null;
    for (var j=0; j<recs.length; j++) {
      if (!latest || (recs[j].startDate || "") > (latest.startDate || "")) latest = recs[j];
    }
    if (latest && latest.startDate) {
      var diff = (now - new Date(latest.startDate)) / (1000*60*60*24*30);
      if (diff >= 4) cnt++;
    }
  }
  var b = document.getElementById("abadge");
  if (cnt > 0) { b.textContent = cnt; b.style.display = "flex"; }
  else { b.style.display = "none"; }
}

function render() {
  updateBadge();
  var m = document.getElementById("main");
  if (curTab === "timeline") m.innerHTML = renderTL();
  else if (curTab === "alert") m.innerHTML = renderAlert();
  else m.innerHTML = renderSummary();
  bindEvents();
}

function renderTL() {
  var g = groupBy();
  var keys = Object.keys(g);
  if (!keys.length) return '<div class="empty">📱<br><br>まだ記録がありません</div>';
  var html = "";
  for (var ki=0; ki<keys.length; ki++) {
    var num = keys[ki];
    var recs = g[num];
    var totalP = 0;
    for (var i=0; i<recs.length; i++) totalP += calcP(recs[i]).profit;
    var activeRec = null;
    for (var i=0; i<recs.length; i++) { if (recs[i].status === "active") { activeRec = recs[i]; break; } }

    var rows = "";
    for (var ri=0; ri<recs.length; ri++) {
      var r = recs[ri];
      var p = calcP(r).profit;
      var isLast = ri === recs.length - 1;
      var isActive = r.status === "active";
      var col = cc(r.carrier);
      var dotStyle = "border-color:" + col + ";";
      if (isActive) dotStyle += "background:" + col + ";box-shadow:0 0 8px " + col + "80;";

      var chips = "";
      var incs = r.incomes || [];
      for (var ii=0; ii<incs.length; ii++) {
        var inc = incs[ii];
        var t = TMAP[inc.type] || {i:"💰"};
        var recv = (inc.status || "expected") === "received";
        var cls = recv ? "ichip irecv" : "ichip iexp";
        chips += '<span class="' + cls + '">' + t.i + ' +' + n(inc.amount).toLocaleString() + ' ' + (recv ? "✅" : "⏳") + '</span>';
      }

      var activeBadge = isActive ? '<span style="font-size:10px;font-weight:700;margin-left:6px;padding:1px 7px;border-radius:99px;background:rgba(0,255,198,0.12);color:#00ffc6">運用中</span>' : "";
      var dateRange = fd(r.startDate) + " 〜 " + (r.endDate ? fd(r.endDate) : "現在");
      var planLine = r.plan ? '<div style="font-size:11px;color:#7dd3fc;margin-bottom:3px">📦 ' + r.plan + '</div>' : "";
      var chipsLine = chips ? '<div style="margin-top:4px">' + chips + '</div>' : "";
      var stemLine = isLast ? "" : '<div class="tlstem"></div>';

      rows += '<div class="tlrow">';
      rows += '<div class="tlline"><div class="tldot" style="' + dotStyle + '"></div>' + stemLine + '</div>';
      rows += '<div class="tlcontent' + (isLast ? " last" : "") + '">';
      rows += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:3px">';
      rows += '<div><span style="font-size:14px;font-weight:900;color:#fff">' + r.carrier + '</span>' + activeBadge + '</div>';

}

function renderAlert() {
  var now = new Date();
  var g = groupBy();
  var keys = Object.keys(g);
  if (!keys.length) return '<div class="empty">📱<br><br>記録がありません</div>';

  var items = [];
  for (var i=0; i<keys.length; i++) {
    var num = keys[i];
    var recs = g[num];
    var latest = null;
    for (var j=0; j<recs.length; j++) {
      if (!latest || (recs[j].startDate || "") > (latest.startDate || "")) latest = recs[j];
    }
    var elapsed = 0;
    if (latest && latest.startDate) elapsed = (now - new Date(latest.startDate)) / (1000*60*60*24*30);
    items.push({num:num, latest:latest, elapsed:elapsed});
  }
  items.sort(function(a,b) { return b.elapsed - a.elapsed; });

  var ready = [], notYet = [];
  for (var i=0; i<items.length; i++) {
    if (items[i].elapsed >= 4) ready.push(items[i]);
    else notYet.push(items[i]);
  }

  var html = "";
  if (ready.length) {
    html += '<div style="font-size:13px;font-weight:700;color:#ff6b6b;margin-bottom:10px">🔔 MNP可能な番号（' + ready.length + '件）</div>';
    for (var i=0; i<ready.length; i++) {
      var x = ready[i];
      html += '<div class="accard acready">';
      html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">';
      html += '<div><div style="font-size:14px;font-weight:900;color:#fff;font-family:monospace">📞 ' + x.num + '</div>';
      html += '<div style="font-size:12px;color:#94a3b8;margin-top:3px">' + x.latest.carrier + ' / ' + fd(x.latest.startDate) + '〜</div></div>';
      html += '<div style="text-align:right"><div style="font-size:22px;font-weight:900;color:#ff6b6b">' + Math.floor(x.elapsed) + 'ヶ月</div>';
      html += '<div style="font-size:10px;color:rgba(255,107,107,0.5)">経過</div></div></div>';
      html += '<div style="background:rgba(255,107,107,0.08);border:1px solid rgba(255,107,107,0.18);border-radius:8px;padding:8px 12px;font-size:12px;color:#ff6b6b;font-weight:700">✅ MNP転出OKです！</div>';
      html += '</div>';
    }
  }
  if (notYet.length) {
    html += '<div style="font-size:13px;font-weight:700;color:#64748b;margin:' + (ready.length ? 20 : 0) + 'px 0 10px">⏳ まだ早い番号（' + notYet.length + '件）</div>';
    for (var i=0; i<notYet.length; i++) {
      var x = notYet[i];
      var rem = 4 - x.elapsed;
      var pct = Math.min(100, (x.elapsed/4)*100);
      var rdDate = "";
      if (x.latest && x.latest.startDate) {
        var d = new Date(new Date(x.latest.startDate).getTime() + 4*30*24*60*60*1000);
        rdDate = (d.getMonth()+1) + "月" + d.getDate() + "日〜";
      }
      html += '<div class="accard acwait">';
      html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">';
      html += '<div><div style="font-size:14px;font-weight:900;color:#fff;font-family:monospace">📞 ' + x.num + '</div>';
      html += '<div style="font-size:12px;color:#94a3b8;margin-top:3px">' + x.latest.carrier + ' / ' + fd(x.latest.startDate) + '〜</div></div>';
      html += '<div style="text-align:right"><div style="font-size:17px;font-weight:900;color:#7dd3fc">あと' + Math.ceil(rem*30) + '日</div>';
      html += '<div style="font-size:10px;color:#64748b">' + rdDate + '</div></div></div>';
      html += '<div class="pgbg"><div class="pgfill" style="width:' + pct + '%"></div></div>';
      html += '<div style="font-size:10px;color:#475569;margin-top:4px;text-align:right">' + Math.floor(x.elapsed) + 'ヶ月 / 4ヶ月</div>';
      html += '</div>';
    }
  }
  return html;
}

function renderSummary() {
  var totP=0, totI=0, totC=0;
  for (var i=0; i<records.length; i++) {
    var p = calcP(records[i]);
    totP += p.profit; totI += p.income; totC += p.cost;
  }
  var byType = {};
  for (var i=0; i<records.length; i++) {
    var incs = records[i].incomes || [];
    for (var j=0; j<incs.length; j++) {
      var t = incs[j].type;
      byType[t] = (byType[t] || 0) + n(incs[j].amount);
    }
  }
  var typeKeys = Object.keys(byType).sort(function(a,b){ return byType[b]-byType[a]; });
  var typeRows = "";
  for (var i=0; i<typeKeys.length; i++) {
    var t = TMAP[typeKeys[i]] || {i:"💰",l:typeKeys[i]};
    typeRows += '<div style="display:flex;align-items:center;justify-content:space-between;background:#111827;border:1px solid #1e293b;border-radius:10px;padding:10px 12px;margin-bottom:6px">';
    typeRows += '<div style="display:flex;align-items:center;gap:8px"><span>' + t.i + '</span><span style="font-size:13px;color:#94a3b8">' + t.l + '</span></div>';
    typeRows += '<span style="font-family:monospace;color:#00ffc6;font-weight:700">+' + byType[typeKeys[i]].toLocaleString() + '円</span></div>';
  }
  var sorted = records.slice().sort(function(a,b){
    var ad = a.startDate || ""; var bd = b.startDate || "";
    return ad < bd ? 1 : ad > bd ? -1 : 0;
  });
  var perRows = "";
  for (var i=0; i<sorted.length; i++) {
    var r = sorted[i];
    var p = calcP(r);
    perRows += '<div style="background:#111827;border:1px solid #1e293b;border-radius:12px;padding:12px 14px;margin-bottom:8px">';
    perRows += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">';
    perRows += '<span style="font-weight:700;font-size:14px">' + r.carrier + '</span>' + ph(p.profit) + '</div>';
    perRows += '<div style="font-size:11px;color:#64748b;margin-bottom:5px">' + fd(r.startDate) + ' 〜 ' + (fd(r.endDate)||"現在") + ' (' + p.months + 'ヶ月)</div>';
    perRows += '<div style="display:flex;gap:14px;font-size:12px">';
    perRows += '<span style="color:#00ffc6">収入 +' + p.income.toLocaleString() + '円</span>';
    perRows += '<span style="color:#ff6b6b">出費 ' + p.cost.toLocaleString() + '円</span></div></div>';
  }
  var actCnt = 0;
  for (var i=0; i<records.length; i++) { if (records[i].status==="active") actCnt++; }
  var bigCls = totP >= 0 ? "pos" : "neg";
  var bigSign = totP >= 0 ? "+" : "";
  var html = '<div class="shero">';
  html += '<div style="font-size:12px;color:#00ffc6;letter-spacing:.1em;margin-bottom:8px">累計純利益</div>';
  html += '<div style="font-size:38px;font-weight:900;font-family:monospace;letter-spacing:-.03em" class="' + bigCls + '">' + bigSign + totP.toLocaleString() + '<span style="font-size:20px">円</span></div>';
  html += '<div style="font-size:12px;color:#64748b;margin-top:8px">' + records.length + '回のMNP</div></div>';
  html += '<div class="g2">';
  html += '<div class="scard"><div class="sl">総収入</div><div class="sv pos">+' + totI.toLocaleString() + '円</div></div>';
  html += '<div class="scard"><div class="sl">総出費</div><div class="sv neg">' + totC.toLocaleString() + '円</div></div>';
  html += '<div class="scard"><div class="sl">MNP回数</div><div class="sv" style="color:#7dd3fc">' + records.length + '回</div></div>';
  html += '<div class="scard"><div class="sl">運用中</div><div class="sv" style="color:#a78bfa">' + actCnt + '件</div></div>';
  html += '</div>';
  html += '<div style="font-size:13px;font-weight:700;color:#64748b;margin-bottom:10px">収入タイプ別合計</div>' + typeRows;
  html += '<div style="font-size:13px;font-weight:700;color:#64748b;margin:18px 0 10px">各MNPの収支</div>' + perRows;
  return html;
}

        '</div>' +

      div.querySelector(".numinp").addEventListener("input", function(e) { fInc[idx].amount = e.target.value; updateTotals(); updatePV(); });

      div.querySelector(".noteinp").addEventListener("input", function(e) { fInc[idx].note = e.target.value; });

  ab.className = "addbtn";
  ab.style.color = "#00ffc6";
  ab.textContent = "＋ 収入を追加";

  box.appendChild(ab);
  updateTotals();
}

function renderFee() {
  var box = document.getElementById("feeEditor");

  for (var i=0; i<fFee.length; i++) {
    (function(idx) {

      var rb = div.querySelector(".rmFee");

function updateTotals() {
  var ti = 0;
  for (var i=0; i<fInc.length; i++) ti += n(fInc[i].amount);
  document.getElementById("incTotal").textContent = "合計 +" + ti.toLocaleString() + "円";
  var tf = 0;
  for (var i=0; i<fFee.length; i++) tf += n(fFee[i].amount);
  document.getElementById("feeTotal").textContent = "合計 " + tf.toLocaleString() + "円";
}

function updatePV() {
  var inc = 0;
  for (var i=0; i<fInc.length; i++) inc += n(fInc[i].amount);
  var fees = 0;
  for (var i=0; i<fFee.length; i++) fees += n(fFee[i].amount);
  var cost = fees + n(document.getElementById("fSetup").value) + n(document.getElementById("fOther").value);
  var profit = inc - cost;
  document.getElementById("pvInc").textContent = "+" + inc.toLocaleString();
  document.getElementById("pvCost").textContent = cost.toLocaleString();
  var pv = document.getElementById("pvProfit");
  pv.textContent = (profit>=0?"+":"") + profit.toLocaleString();
  pv.className = "pvval " + (profit>=0?"pos":"neg");
}

document.getElementById("fSetup").addEventListener("input", updatePV);
document.getElementById("fOther").addEventListener("input", updatePV);

function openEdit(id) {
  var r = null;
  for (var i=0; i<records.length; i++) { if (records[i].id === id) { r = records[i]; break; } }
  if (!r) return;
  editId = id;
  document.getElementById("editTitle").textContent = "記録を編集";
  document.getElementById("fCarrier").value = r.carrier || "docomo";
  document.getElementById("fStatus").value = r.status || "active";
  document.getElementById("fPhone").value = r.phoneNumber || "";
  document.getElementById("fPlan").value = r.plan || "";
  document.getElementById("fStart").value = r.startDate || "";
  document.getElementById("fEnd").value = r.endDate || "";
  document.getElementById("fSetup").value = r.setupCost || "";
  document.getElementById("fOther").value = r.otherCost || "";
  document.getElementById("fNotes").value = r.notes || "";
  fInc = [];
  var incs = r.incomes || [];
  for (var i=0; i<incs.length; i++) fInc.push({type:incs[i].type||"cash",amount:incs[i].amount||"",note:incs[i].note||"",status:incs[i].status||"expected",date:incs[i].date||""});
  fFee = [];
  var fees = r.monthlyFees || [];
  for (var i=0; i<fees.length; i++) fFee.push({label:fees[i].label||(i+1)+"ヶ月め",amount:fees[i].amount||"",note:fees[i].note||""});
  if (!fInc.length) fInc = [{type:"cash",amount:"",note:"",status:"expected",date:""}];
  if (!fFee.length) fFee = [{label:"1ヶ月め",amount:"",note:""}];
  renderInc(); renderFee(); updatePV();
  document.getElementById("editOvl").style.display = "flex";
}

document.getElementById("editSave").addEventListener("click", function() {
  var entry = {
    carrier: document.getElementById("fCarrier").value,
    status: document.getElementById("fStatus").value,
    phoneNumber: document.getElementById("fPhone").value,
    plan: document.getElementById("fPlan").value,
    startDate: document.getElementById("fStart").value,
    endDate: document.getElementById("fEnd").value,
    setupCost: n(document.getElementById("fSetup").value),
    otherCost: n(document.getElementById("fOther").value),
    notes: document.getElementById("fNotes").value,
    incomes: [], monthlyFees: []
  };
  for (var i=0; i<fInc.length; i++) entry.incomes.push({type:fInc[i].type,amount:n(fInc[i].amount),note:fInc[i].note,status:fInc[i].status,date:fInc[i].date});
  for (var i=0; i<fFee.length; i++) entry.monthlyFees.push({label:fFee[i].label,amount:n(fFee[i].amount),note:fFee[i].note});
  if (editId === null) {
    entry.id = Date.now();
    records.push(entry);
  } else {
    for (var i=0; i<records.length; i++) {
      if (records[i].id === editId) { records[i] = Object.assign({}, records[i], entry); break; }
    }
  }
  sv(); closeEdit(); render();
});

document.getElementById("importBtn").addEventListener("click", function() { closeImp(); document.getElementById("impOvl").style.display = "flex"; });
document.getElementById("impCancel").addEventListener("click", closeImp);
document.getElementById("impCancel2").addEventListener("click", closeImp);
document.getElementById("impOvl").addEventListener("click", function(e) { if (e.target === e.currentTarget) closeImp(); });
document.getElementById("mMerge").addEventListener("click", function() { setImpMode("merge"); });
document.getElementById("mReplace").addEventListener("click", function() { setImpMode("replace"); });

document.getElementById("impFile").addEventListener("change", function(e) {
  var files = e.target.files;
  var file = files && files.length > 0 ? files[0] : null;
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var p = JSON.parse(ev.target.result);
      if (!Array.isArray(p)) throw new Error("配列形式のJSONではありません");
      impData = p;
      document.getElementById("impErr").style.display = "none";
      document.getElementById("impOk").style.display = "block";
      document.getElementById("impOk").textContent = "✅ " + p.length + "件のデータを検出";
      document.getElementById("impModeWrap").style.display = "block";
      document.getElementById("impCancelOnly").style.display = "none";
    } catch(err) {
      impData = null;
      document.getElementById("impErr").style.display = "block";
      document.getElementById("impErr").textContent = "読み込みエラー: " + err.message;
      document.getElementById("impOk").style.display = "none";
      document.getElementById("impModeWrap").style.display = "none";
      document.getElementById("impCancelOnly").style.display = "block";
    }
  };
  reader.readAsText(file);
});

document.getElementById("impDoBtn").addEventListener("click", function() {
  if (!impData) return;
  if (impMode === "replace") {
    records = impData;
  } else {
    var ids = {};
    for (var i=0; i<records.length; i++) ids[records[i].id] = true;
    for (var i=0; i<impData.length; i++) { if (!ids[impData[i].id]) records.push(impData[i]); }
  }
  sv(); closeImp(); render();
});

render();
</script>
</body>
</html>
